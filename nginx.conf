server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Hashed build assets never change, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Data files must 404 when missing instead of falling through to the SPA
    # shell, which would return index.html with a 200 and break JSON parsing.
    location ~ \.json$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
