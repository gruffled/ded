name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SRD extractor/data tests
        run: python3 -m unittest discover scripts -p 'test_*.py'

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-24.04
    # A frozen browser never fails on its own; fail fast instead of hanging for hours.
    timeout-minutes: 15
    container:
      image: cypress/included:15.16.0
      # Chrome crashes or freezes with the container default of 64 MB shared memory.
      options: --shm-size=2gb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start production preview
        run: npm run preview -- --host 0.0.0.0 > /tmp/daggerheart-preview.log 2>&1 &

      - name: Run Cypress browser tests
        timeout-minutes: 10
        run: cypress run --browser chrome --config baseUrl=http://127.0.0.1:4173

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts-${{ github.sha }}
          path: |
            cypress/screenshots/
            /tmp/daggerheart-preview.log
          if-no-files-found: ignore
